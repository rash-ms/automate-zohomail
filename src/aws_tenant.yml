name: aws-tenant-infra

on:
  push:
    paths:
      - '.github/workflows/aws-tenant-infra.yml'
      - 'infra/**'

jobs:
  # data-platform-nonprod
  data-platform-nonprod-us-east-1:
    uses: CondeNast/global-workflows/.github/workflows/lit-terraform.yml@6.2.0
    with:
      version: 1-1.2.6
      environment_plan: data-platform-nonprod-protected
      environment_apply: data-platform-nonprod-protected
      infra_dir: data-platform-nonprod/us-east-1
      working_dir: infra
      aws_default_region: us-east-1
      main_branch: main
    secrets:
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ecr_aws_access_key_id: ${{ secrets.ECR_AWS_ACCESS_KEY_ID  }}
      ecr_aws_secret_access_key: ${{ secrets.ECR_AWS_SECRET_ACCESS_KEY }}
      terraform_modules_deploy_key: ${{ secrets.GLOBAL_TERRAFORM_MODULES_DEPLOY_KEY }}
      tf_env_vars: |
        TMPDIR=${{ github.workspace }}/infra/.tmp
        TF_PLUGIN_CACHE_DIR=${{ github.workspace }}/infra/.terraform-plugin-cache
        TF_VAR_influxdb_username=${{ secrets.INFLUXDB_USERNAME }}
        TF_VAR_influxdb_password=${{ secrets.INFLUXDB_PASSWORD }}

  data-platform-nonprod-eu-central-1:
    uses: CondeNast/global-workflows/.github/workflows/lit-terraform.yml@6.2.0
    with:
      version: 1-1.2.6
      environment_plan: data-platform-nonprod-protected
      environment_apply: data-platform-nonprod-protected
      infra_dir: data-platform-nonprod/eu-central-1
      working_dir: infra
      aws_default_region: eu-central-1
      main_branch: main
    secrets:
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ecr_aws_access_key_id: ${{ secrets.ECR_AWS_ACCESS_KEY_ID  }}
      ecr_aws_secret_access_key: ${{ secrets.ECR_AWS_SECRET_ACCESS_KEY }}
      terraform_modules_deploy_key: ${{ secrets.GLOBAL_TERRAFORM_MODULES_DEPLOY_KEY }}
      tf_env_vars: |
        TMPDIR=${{ github.workspace }}/infra/.tmp
        TF_PLUGIN_CACHE_DIR=${{ github.workspace }}/infra/.terraform-plugin-cache
        TF_VAR_influxdb_username=${{ secrets.INFLUXDB_USERNAME }}
        TF_VAR_influxdb_password=${{ secrets.INFLUXDB_PASSWORD }}


  # data-platform-prod
  data-platform-prod-us-east-1:
    needs: data-platform-nonprod-us-east-1
    uses: CondeNast/global-workflows/.github/workflows/lit-terraform.yml@6.2.0
    with:
      version: 1-1.2.6
      environment_plan: data-platform-prod-protected
      environment_apply: data-platform-prod-protected
      infra_dir: data-platform-prod/us-east-1
      working_dir: infra
      aws_default_region: us-east-1
      main_branch: main
    secrets:
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ecr_aws_access_key_id: ${{ secrets.ECR_AWS_ACCESS_KEY_ID  }}
      ecr_aws_secret_access_key: ${{ secrets.ECR_AWS_SECRET_ACCESS_KEY }}
      terraform_modules_deploy_key: ${{ secrets.GLOBAL_TERRAFORM_MODULES_DEPLOY_KEY }}
      tf_env_vars: |
        TMPDIR=${{ github.workspace }}/infra/.tmp
        TF_PLUGIN_CACHE_DIR=${{ github.workspace }}/infra/.terraform-plugin-cache
        TF_VAR_influxdb_username=${{ secrets.INFLUXDB_USERNAME }}
        TF_VAR_influxdb_password=${{ secrets.INFLUXDB_PASSWORD }}
